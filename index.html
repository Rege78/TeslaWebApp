<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedometer</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050505;
      --card: #111;
      --muted: #8d8d8d;
      --accent: #35a7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--background);
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    #speed {
      font-size: clamp(100px, 25vw, 200px);
      font-weight: 300;
      line-height: 1;
      margin-top: 18px;
    }

    .unit {
      color: var(--muted);
      font-size: clamp(24px, 5vw, 40px);
      margin-bottom: 28px;
    }

    .chart-card {
      padding: 18px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: var(--card);
      text-align: left;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 500;
      color: #ddd;
    }

    canvas {
      display: block;
      width: 100%;
      height: 260px;
    }
  </style>
</head>
<body>
  <main>
    <div id="speed">--</div>
    <div class="unit">km/h</div>

    <section class="chart-card">
      <h2>Speed </h2>
      <canvas id="speedChart" aria-label="Speed over time graph"></canvas>
    </section>
  </main>

  <script>
    const speedElement = document.getElementById("speed");
    const canvas = document.getElementById("speedChart");
    const context = canvas.getContext("2d");
    const readings = [];
    const maxReadings = 160;

    function resizeCanvas() {
      const scale = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      canvas.width = width * scale;
      canvas.height = height * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      drawChart();
    }

    function drawChart() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const padding = { top: 16, right: 12, bottom: 30, left: 42 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const maximum = Math.max(10, ...readings.map((reading) => reading.value));
      const yMaximum = Math.ceil(maximum / 10) * 10;

      context.clearRect(0, 0, width, height);
      context.font = "12px system-ui, sans-serif";
      context.lineWidth = 1;
      context.strokeStyle = "#292929";
      context.fillStyle = "#8d8d8d";

      for (let step = 0; step <= 4; step += 1) {
        const y = padding.top + (chartHeight * step / 4);
        const value = Math.round(yMaximum * (1 - step / 4));
        context.beginPath();
        context.moveTo(padding.left, y);
        context.lineTo(width - padding.right, y);
        context.stroke();
        context.fillText(value, 4, y + 4);
      }

      if (readings.length === 0) {
        context.textAlign = "center";
        context.fillText("Waiting for GPS speed…", width / 2, height / 2);
        context.textAlign = "left";
        return;
      }

      const points = readings.map((reading, index) => ({
        x: padding.left + (readings.length === 1 ? chartWidth / 2 : chartWidth * index / (readings.length - 1)),
        y: padding.top + chartHeight * (1 - reading.value / yMaximum)
      }));

      context.beginPath();
      context.moveTo(points[0].x, padding.top + chartHeight);
      points.forEach((point) => context.lineTo(point.x, point.y));
      context.lineTo(points[points.length - 1].x, padding.top + chartHeight);
      context.closePath();
      context.fillStyle = "rgba(53, 167, 255, 0.16)";
      context.fill();

      context.beginPath();
      context.moveTo(points[0].x, points[0].y);
      points.slice(1).forEach((point) => context.lineTo(point.x, point.y));
      context.strokeStyle = "#35a7ff";
      context.lineWidth = 3;
      context.stroke();

      context.fillStyle = "#8d8d8d";
      context.fillText("now", width - 30, height - 8);
      context.fillText("time", width / 2 - 12, height - 8);
    }

    function recordSpeed(speed) {
      readings.push({ value: speed, time: Date.now() });
      if (readings.length > maxReadings) readings.shift();
      speedElement.textContent = Math.round(speed);
      drawChart();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    navigator.geolocation.watchPosition(
      function (position) {
        const metersPerSecond = position.coords.speed;
        if (metersPerSecond !== null && Number.isFinite(metersPerSecond)) {
          recordSpeed(metersPerSecond * 3.6);
        }
      },
      function (error) {
        console.log(error);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
      }
    );
  </script>
</body>
</html>
