<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedometer</title>
  <style>
    :root { color-scheme: dark; --background:#050505; --card:#111; --muted:#8d8d8d; --speed:#35a7ff; --acceleration:#ff9f43; --motion-x:#ff5c8a; --motion-y:#7ee787; --motion-z:#c084fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; padding:clamp(8px,2vh,24px); background:var(--background); color:white; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-align:center; overflow-x:hidden; }
    main { width:min(900px,100%); margin:0 auto; }
    #speed { font-size:clamp(64px,16vh,140px); font-weight:300; line-height:.9; margin-top:clamp(4px,1vh,18px); }
    .unit { color:var(--muted); font-size:clamp(18px,3.5vh,32px); margin-bottom:clamp(8px,2vh,28px); }
    .status { color:var(--muted); font-size:.8rem; margin:-8px 0 14px; min-height:1.1em; }
    .chart-card { padding:clamp(8px,1.5vh,18px); border:1px solid #292929; border-radius:14px; background:var(--card); text-align:left; }
    .chart-card + .chart-card { margin-top:clamp(8px,1.5vh,18px); }
    h2 { margin:0 0 6px; font-size:.9rem; font-weight:500; color:#ddd; }
    .legend { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:4px; color:var(--muted); font-size:.75rem; }
    .legend span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--color); }
    canvas { display:block; width:100%; height:clamp(250px,36vh,420px); }
    #motionChart { height:clamp(150px,22vh,260px); }
    #motionPermission { display:none; margin:0 0 6px; padding:5px 9px; border:1px solid #444; border-radius:8px; background:#222; color:white; cursor:pointer; font-size:.75rem; }
    @media (max-height:700px) { #speed { font-size:clamp(56px,12vh,90px); } canvas { height:clamp(205px,31vh,280px); } #motionChart { height:clamp(125px,18vh,170px); } }
  </style>
</head>
<body>
  <main>
    <div id="speed">--</div>
    <div class="unit">km/h</div>
    <div id="status" class="status" aria-live="polite">Recherche GPS…</div>
    <section class="chart-card">
      <h2>Speed and acceleration over time</h2>
      <div class="legend"><span style="--color:var(--speed)">Speed (km/h)</span><span style="--color:var(--acceleration)">Acceleration (m/s²)</span></div>
      <canvas id="speedChart" aria-label="Speed and acceleration over time graph"></canvas>
    </section>
    <section class="chart-card">
      <h2>Device motion over time</h2>
      <div class="legend"><span style="--color:var(--motion-x)">X</span><span style="--color:var(--motion-y)">Y</span><span style="--color:var(--motion-z)">Z</span></div>
      <button id="motionPermission" type="button">Activer les capteurs de mouvement</button>
      <canvas id="motionChart" aria-label="DeviceMotionEvent X, Y and Z values over time graph"></canvas>
    </section>
  </main>
  <script>
    const speedElement=document.getElementById("speed"), statusElement=document.getElementById("status"), speedCanvas=document.getElementById("speedChart"), speedContext=speedCanvas.getContext("2d"), motionCanvas=document.getElementById("motionChart"), motionContext=motionCanvas.getContext("2d"), motionPermission=document.getElementById("motionPermission");
    const readings=[], maxReadings=160; let latestMotion=null;

    function setStatus(message, isError=false){
      statusElement.textContent=message;
      statusElement.style.color=isError?"#ff9f43":"#8d8d8d";
    }

    function resizeCanvas(canvas,context){const scale=devicePixelRatio||1; canvas.width=canvas.clientWidth*scale; canvas.height=canvas.clientHeight*scale; context.setTransform(scale,0,0,scale,0,0);}
    function resizeCanvases(){resizeCanvas(speedCanvas,speedContext); resizeCanvas(motionCanvas,motionContext); drawSpeedChart(); drawMotionChart();}
    function drawGrid(ctx,left,right,top,height,scale,format,zero=false){ctx.strokeStyle="#292929";ctx.fillStyle="#8d8d8d";ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=top+height*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();if(zero){ctx.fillText(format(0),4,y+4);}else{ctx.fillText(format(scale*(4-i)),4,y+4);}}}
    function xFor(i,width,padding,count){const chartWidth=width-padding.left-padding.right;return padding.left+(count===1?chartWidth/2:chartWidth*i/(count-1));}
    function drawLine(ctx,points,color){ctx.strokeStyle=color;ctx.lineWidth=3;let drawing=false;points.forEach((p)=>{if(!p){drawing=false;return;}if(!drawing){ctx.beginPath();ctx.moveTo(p.x,p.y);drawing=true;}else{ctx.lineTo(p.x,p.y);}});if(drawing)ctx.stroke();}
    function drawSpeedChart(){const width=speedCanvas.clientWidth,height=speedCanvas.clientHeight,p={top:18,right:42,bottom:24,left:42},gap=30,h=(height-p.top-p.bottom-gap)/2,accTop=p.top+h+gap,speedScale=Math.ceil(Math.max(10,...readings.map(r=>r.speed))/10)*10,accScale=Math.ceil(Math.max(1,...readings.map(r=>Math.abs(r.acceleration)))*2)/2;speedContext.clearRect(0,0,width,height);speedContext.font="11px system-ui,sans-serif";drawGrid(speedContext,p.left,width-p.right,p.top,h,speedScale,v=>Math.round(v),false);drawGrid(speedContext,p.left,width-p.right,accTop,h,accScale,v=>(v).toFixed(1),true);speedContext.fillStyle="#8d8d8d";speedContext.fillText("Speed (km/h)",p.left,p.top-5);speedContext.fillText("Acceleration (m/s²)",p.left,accTop-5);if(!readings.length)return;const speedPoints=readings.map((r,i)=>({x:xFor(i,width,p,readings.length),y:p.top+h*(1-r.speed/speedScale)}));const accPoints=readings.map((r,i)=>({x:xFor(i,width,p,readings.length),y:accTop+h*(1-(r.acceleration+accScale)/(accScale*2))}));drawLine(speedContext,speedPoints,"#35a7ff");drawLine(speedContext,accPoints,"#ff9f43");speedContext.fillStyle="#8d8d8d";speedContext.textAlign="right";speedContext.fillText("time",width-5,height-5);}
    function drawMotionChart(){const width=motionCanvas.clientWidth,height=motionCanvas.clientHeight,p={top:18,right:42,bottom:24,left:42},h=height-p.top-p.bottom,maximum=Math.max(1,...readings.flatMap(r=>r.motion?[Math.abs(r.motion.x),Math.abs(r.motion.y),Math.abs(r.motion.z)]:[0])),scale=Math.ceil(maximum*2)/2;motionContext.clearRect(0,0,width,height);motionContext.font="11px system-ui,sans-serif";drawGrid(motionContext,p.left,width-p.right,p.top,h,scale,v=>v.toFixed(1),true);motionContext.fillStyle="#8d8d8d";motionContext.fillText("DeviceMotionEvent (m/s²)",p.left,p.top-5);if(!readings.some(r=>r.motion)){motionContext.textAlign="center";motionContext.fillText("Waiting for device motion…",width/2,height/2);motionContext.textAlign="left";return;}["x","y","z"].forEach((axis,index)=>{const color=["#ff5c8a","#7ee787","#c084fc"][index];const points=readings.map((r,i)=>r.motion?{x:xFor(i,width,p,readings.length),y:p.top+h*(1-(r.motion[axis]+scale)/(scale*2))}:null);drawLine(motionContext,points,color);});motionContext.fillStyle="#8d8d8d";motionContext.textAlign="right";motionContext.fillText("time",width-5,height-5);}
    function recordSpeed(speed,time){const previous=readings[readings.length-1],elapsed=previous?(time-previous.time)/1000:0,acceleration=previous&&elapsed>0?(speed/3.6-previous.speed/3.6)/elapsed:0;readings.push({speed,acceleration,time,motion:latestMotion});if(readings.length>maxReadings)readings.shift();speedElement.textContent=Math.round(speed);setStatus("GPS actif");drawSpeedChart();drawMotionChart();}
    function handleMotion(event){const motion=event.acceleration||event.accelerationIncludingGravity;if(!motion||[motion.x,motion.y,motion.z].some(v=>!Number.isFinite(v)))return;latestMotion={x:motion.x,y:motion.y,z:motion.z,time:event.timeStamp||Date.now()};drawMotionChart();}
    function startMotionTracking(){addEventListener("devicemotion",handleMotion);motionPermission.style.display="none";}

    function startGpsTracking(){
      if (!navigator.geolocation) {
        setStatus("Le GPS n'est pas supporté par ce navigateur.", true);
        return;
      }

      navigator.geolocation.watchPosition(
        (position) => {
          const speed = position.coords.speed;

          if (speed !== null && Number.isFinite(speed)) {
            recordSpeed(speed * 3.6, position.timestamp || Date.now());
          } else {
            setStatus("Vitesse GPS non disponible pour le moment.");
          }
        },
        (error) => {
          const messages = {1:"Permission GPS refusée.",2:"Position GPS indisponible.",3:"Délai GPS dépassé."};
          setStatus(messages[error.code] || "Erreur GPS inconnue.", true);
          console.log(error);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){motionPermission.style.display="inline-block";motionPermission.onclick=async()=>{try{if(await DeviceMotionEvent.requestPermission()==="granted")startMotionTracking();}catch(error){console.log(error);}};}else if("DeviceMotionEvent" in window){startMotionTracking();}
    addEventListener("resize",resizeCanvases);resizeCanvases();
    startGpsTracking();
  </script>
</body>
</html>
