<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedometer</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050505;
      --card: #111;
      --muted: #8d8d8d;
      --speed: #35a7ff;
      --acceleration: #ff9f43;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--background);
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(900px, 100%); margin: 0 auto; }
    #speed {
      font-size: clamp(100px, 25vw, 200px);
      font-weight: 300;
      line-height: 1;
      margin-top: 18px;
    }
    .unit {
      color: var(--muted);
      font-size: clamp(24px, 5vw, 40px);
      margin-bottom: 28px;
    }
    .chart-card {
      padding: 18px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: var(--card);
      text-align: left;
    }
    h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 500; color: #ddd; }
    .legend { display: flex; gap: 18px; margin-bottom: 8px; color: var(--muted); font-size: .85rem; }
    .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--color); }
    canvas { display: block; width: 100%; height: 280px; }
  </style>
</head>
<body>
  <main>
    <div id="speed">--</div>
    <div class="unit">km/h</div>
    <section class="chart-card">
      <h2>Speed and acceleration over time</h2>
      <div class="legend">
        <span style="--color: var(--speed)">Speed (km/h)</span>
        <span style="--color: var(--acceleration)">Acceleration (m/s²)</span>
      </div>
      <canvas id="speedChart" aria-label="Speed and acceleration over time graph"></canvas>
    </section>
  </main>

  <script>
    const speedElement = document.getElementById("speed");
    const canvas = document.getElementById("speedChart");
    const context = canvas.getContext("2d");
    const readings = [];
    const maxReadings = 160;

    function resizeCanvas() {
      const scale = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * scale;
      canvas.height = canvas.clientHeight * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      drawChart();
    }

    function drawChart() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const padding = { top: 16, right: 48, bottom: 30, left: 48 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const speedMaximum = Math.max(10, ...readings.map((reading) => reading.speed));
      const speedScale = Math.ceil(speedMaximum / 10) * 10;
      const accelerationMaximum = Math.max(1, ...readings.map((reading) => Math.abs(readings.length ? reading.acceleration : 0)));
      const accelerationScale = Math.ceil(accelerationMaximum * 2) / 2;

      context.clearRect(0, 0, width, height);
      context.font = "12px system-ui, sans-serif";
      context.lineWidth = 1;
      context.strokeStyle = "#292929";
      context.fillStyle = "#8d8d8d";

      for (let step = 0; step <= 4; step += 1) {
        const y = padding.top + chartHeight * step / 4;
        context.beginPath();
        context.moveTo(padding.left, y);
        context.lineTo(width - padding.right, y);
        context.stroke();
        context.fillText(Math.round(speedScale * (1 - step / 4)), 4, y + 4);
        context.textAlign = "right";
        context.fillText((accelerationScale * (1 - step / 4)).toFixed(1), width - 4, y + 4);
        context.textAlign = "left";
      }

      if (readings.length === 0) {
        context.textAlign = "center";
        context.fillText("Waiting for GPS speed…", width / 2, height / 2);
        context.textAlign = "left";
        return;
      }

      const pointFor = (reading, index, value, scale) => ({
        x: padding.left + (readings.length === 1 ? chartWidth / 2 : chartWidth * index / (readings.length - 1)),
        y: padding.top + chartHeight * (1 - value / scale)
      });
      const speedPoints = readings.map((reading, index) => pointFor(reading, index, reading.speed, speedScale));
      const accelerationPoints = readings.map((reading, index) => pointFor(reading, index, Math.max(0, reading.acceleration), accelerationScale));

      function drawLine(points, color) {
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach((point) => context.lineTo(point.x, point.y));
        context.strokeStyle = color;
        context.lineWidth = 3;
        context.stroke();
      }

      drawLine(speedPoints, "#35a7ff");
      drawLine(accelerationPoints, "#ff9f43");
      context.fillStyle = "#8d8d8d";
      context.fillText("Speed", 4, 12);
      context.textAlign = "right";
      context.fillText("Acceleration", width - 4, 12);
      context.textAlign = "left";
      context.fillText("time", width / 2 - 12, height - 8);
    }

    function recordSpeed(speed, timestamp) {
      const previous = readings[readings.length - 1];
      const elapsedSeconds = previous ? (timestamp - previous.time) / 1000 : 0;
      const acceleration = previous && elapsedSeconds > 0 ? (speed / 3.6 - previous.speed / 3.6) / elapsedSeconds : 0;
      readings.push({ speed, acceleration, time: timestamp });
      if (readings.length > maxReadings) readings.shift();
      speedElement.textContent = Math.round(speed);
      drawChart();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    navigator.geolocation.watchPosition(
      function (position) {
        const metersPerSecond = position.coords.speed;
        if (metersPerSecond !== null && Number.isFinite(metersPerSecond)) {
          recordSpeed(metersPerSecond * 3.6, position.timestamp || Date.now());
        }
      },
      function (error) { console.log(error); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
    );
  </script>
</body>
</html>
