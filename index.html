<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedometer</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050505;
      --card: #111;
      --muted: #8d8d8d;
      --speed: #35a7ff;
      --acceleration: #ff9f43;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--background);
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: min(900px, 100%); margin: 0 auto; }
    #speed {
      font-size: clamp(100px, 25vw, 200px);
      font-weight: 300;
      line-height: 1;
      margin-top: 18px;
    }
    .unit {
      color: var(--muted);
      font-size: clamp(24px, 5vw, 40px);
      margin-bottom: 28px;
    }
    .chart-card {
      padding: 18px;
      border: 1px solid #292929;
      border-radius: 14px;
      background: var(--card);
      text-align: left;
    }
    h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 500; color: #ddd; }
    .legend { display: flex; gap: 18px; margin-bottom: 8px; color: var(--muted); font-size: .85rem; }
    .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--color); }
    canvas { display: block; width: 100%; height: 480px; }
  </style>
</head>
<body>
  <main>
    <div id="speed">--</div>
    <div class="unit">km/h</div>
    <section class="chart-card">
      <h2>Speed and acceleration over time</h2>
      <div class="legend">
        <span style="--color: var(--speed)">Speed (km/h)</span>
        <span style="--color: var(--acceleration)">Acceleration (m/s²)</span>
      </div>
      <canvas id="speedChart" aria-label="Speed and acceleration over time graph"></canvas>
    </section>
  </main>

  <script>
    const speedElement = document.getElementById("speed");
    const canvas = document.getElementById("speedChart");
    const context = canvas.getContext("2d");
    const readings = [];
    const maxReadings = 160;

    function resizeCanvas() {
      const scale = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * scale;
      canvas.height = canvas.clientHeight * scale;
      context.setTransform(scale, 0, 0, scale, 0, 0);
      drawChart();
    }

    function drawChart() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const padding = { top: 22, right: 48, bottom: 30, left: 48 };
      const chartWidth = width - padding.left - padding.right;
      const sectionGap = 42;
      const sectionHeight = (height - padding.top - padding.bottom - sectionGap) / 2;
      const speedTop = padding.top;
      const accelerationTop = speedTop + sectionHeight + sectionGap;
      const speedMaximum = Math.max(10, ...readings.map((reading) => reading.speed));
      const speedScale = Math.ceil(speedMaximum / 10) * 10;
      const accelerationMaximum = Math.max(1, ...readings.map((reading) => Math.abs(reading.acceleration)));
      const accelerationScale = Math.ceil(accelerationMaximum * 2) / 2;

      context.clearRect(0, 0, width, height);
      context.font = "12px system-ui, sans-serif";
      context.lineWidth = 1;
      context.strokeStyle = "#292929";
      context.fillStyle = "#8d8d8d";

      function drawGrid(top, scale, formatter, includeZeroLine = false) {
        for (let step = 0; step <= 4; step += 1) {
          const y = top + sectionHeight * step / 4;
          context.beginPath();
          context.moveTo(padding.left, y);
          context.lineTo(width - padding.right, y);
          context.stroke();
          context.fillText(formatter(scale * (1 - step / 4)), 4, y + 4);
        }
        if (includeZeroLine) {
          const zeroY = top + sectionHeight / 2;
          context.strokeStyle = "#555";
          context.beginPath();
          context.moveTo(padding.left, zeroY);
          context.lineTo(width - padding.right, zeroY);
          context.stroke();
          context.strokeStyle = "#292929";
        }
      }

      drawGrid(speedTop, speedScale, (value) => Math.round(value));
      // The acceleration axis is centered on zero, so braking is shown below it.
      drawGrid(accelerationTop, accelerationScale * 2, (value) => (value - accelerationScale).toFixed(1), true);

      context.fillStyle = "#8d8d8d";
      context.fillText("Speed (km/h)", padding.left, speedTop - 8);
      context.fillText("Acceleration (m/s²)", padding.left, accelerationTop - 8);

      if (readings.length === 0) {
        context.textAlign = "center";
        context.fillText("Waiting for GPS speed…", width / 2, speedTop + sectionHeight / 2);
        context.textAlign = "left";
        return;
      }

      const xFor = (index) => padding.left + (readings.length === 1 ? chartWidth / 2 : chartWidth * index / (readings.length - 1));
      const speedPoint = (reading, index) => ({
        x: xFor(index),
        y: speedTop + sectionHeight * (1 - reading.speed / speedScale)
      });
      const accelerationPoint = (reading, index) => ({
        x: xFor(index),
        y: accelerationTop + sectionHeight * (1 - (reading.acceleration + accelerationScale) / (accelerationScale * 2))
      });

      function drawLine(points, color) {
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach((point) => context.lineTo(point.x, point.y));
        context.strokeStyle = color;
        context.lineWidth = 3;
        context.stroke();
      }

      drawLine(readings.map(speedPoint), "#35a7ff");
      drawLine(readings.map(accelerationPoint), "#ff9f43");
      context.fillStyle = "#8d8d8d";
      context.textAlign = "center";
      context.fillText("time", width / 2, height - 8);
      context.textAlign = "left";
    }

    function recordSpeed(speed, timestamp) {
      const previous = readings[readings.length - 1];
      const elapsedSeconds = previous ? (timestamp - previous.time) / 1000 : 0;
      const acceleration = previous && elapsedSeconds > 0 ? (speed / 3.6 - previous.speed / 3.6) / elapsedSeconds : 0;
      readings.push({ speed, acceleration, time: timestamp });
      if (readings.length > maxReadings) readings.shift();
      speedElement.textContent = Math.round(speed);
      drawChart();
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    navigator.geolocation.watchPosition(
      function (position) {
        const metersPerSecond = position.coords.speed;
        if (metersPerSecond !== null && Number.isFinite(metersPerSecond)) {
          recordSpeed(metersPerSecond * 3.6, position.timestamp || Date.now());
        }
      },
      function (error) { console.log(error); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
    );
  </script>
</body>
</html>
