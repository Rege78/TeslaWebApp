<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center">

<div id="speed" style="font-size:200px;">--</div>
<div style="font-size:40px;">km/h</div>

<script>
navigator.geolocation.watchPosition(
  function(pos) {

    let speed = pos.coords.speed;

    if (speed !== null) {
      let kmh = speed * 3.6;
      document.getElementById("speed").innerHTML =
        Math.round(kmh);
    }

  },
  function(err) {
    console.log(err);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  }
);
</script>

</body>
</html>
